<body class="font-sans text-gray-800 antialiased bg-white flex flex-col min-h-screen">
<!-- Main content -->
<main class="flex-grow bg-brand-light py-12 px-4">
    <div class="max-w-3xl mx-auto">
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 md:p-12">
            <div class="mb-8 text-center">
                <h2 class="font-display font-bold text-3xl md:text-4xl text-brand-darkpink">
                    Contact Us
                </h2>
                <p class="text-gray-600 mt-4 leading-relaxed max-w-xl mx-auto">
                    Whether you have questions about our software, want to say hello, or just want to chat about MIDI, we'd love to hear from you.
                </p>
            </div>
            <form 
                data-action="infoEmail" 
                method="post" 
                enctype="text/plain"
                class="space-y-6"
            >
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Name -->
                    <div class="flex flex-col space-y-2">
                        <label for="name" class="text-sm font-semibold text-gray-900">Your Name <span class="text-brand-pink">*</span></label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            required 
                            placeholder="John Doe"
                            class="rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-pink"
                        >
                    </div>
                    <!-- Email Address -->
                    <div class="flex flex-col space-y-2">
                        <label for="email" class="text-sm font-semibold text-gray-900">Email Address <span class="text-brand-pink">*</span></label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required 
                            placeholder="you@example.com"
                            class="rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-pink"
                        >
                    </div>
                </div>
                <!-- Subject -->
                <div class="flex flex-col space-y-2">
                    <label for="subject" class="text-sm font-semibold text-gray-900">Subject <span class="text-brand-pink">*</span></label>
                    <input 
                        type="text" 
                        id="subject" 
                        name="subject" 
                        required 
                        placeholder="What's this about?"
                        class="rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-pink"
                    >
                </div>
                <!-- Message -->
                <div class="flex flex-col space-y-2">
                    <label for="message" class="text-sm font-semibold text-gray-900">Message <span class="text-brand-pink">*</span></label>
                    <textarea 
                        id="message" 
                        name="message" 
                        rows="6" 
                        required 
                        placeholder="Tell us more..."
                        class="rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm text-gray-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-pink resize-none"
                    ></textarea>
                </div>
                <!-- Submit Button -->
                <div class="pt-4">
                    <button 
                        type="submit" 
                        class="w-full md:w-auto items-center justify-center rounded-full bg-brand-dark px-10 py-4 text-sm font-semibold text-white hover:bg-brand-pink transition-all shadow-lg hover:scale-[1.02]"
                    >
                        Send Message
                    </button>
                </div>
            </form>
            <p class="text-xs text-gray-500 mt-6 italic text-center">
                Note: Clicking "Send Message" will send your message to our team.
            </p>
        </div>
    </div>
</main>
</body>
</html>
